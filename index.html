<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两周年快乐</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        body { background: #f8f4ed; overflow-x: hidden; }

        /* 胶卷颗粒质感 */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0;
            pointer-events: none; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* 密码 */
        .lock {
            position: fixed; inset: 0; z-index: 999;
            background: #f8f4ed; display: flex; align-items: center;
            justify-content: center; transition: opacity 0.7s, visibility 0.7s;
        }
        .lock.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .lock-box { text-align: center; padding: 48px; max-width: 360px; width: 88%; }
        .lock-box .rose {
            font-size: 52px; margin-bottom: 24px; display: block;
        }
        .lock-box h1 {
            font-family: 'Georgia', serif; font-size: 24px;
            color: #3d3029; margin-bottom: 4px; letter-spacing: 3px;
            font-weight: normal;
        }
        .lock-box .hint {
            color: #9b8c7e; font-size: 13px; margin-bottom: 32px;
        }
        .pin { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .pin input {
            width: 44px; height: 52px; text-align: center; font-size: 22px;
            border: 1px solid rgba(193,120,92,0.2); border-radius: 10px;
            outline: none; color: #3d3029; background: #fff;
            transition: all 0.3s; -webkit-appearance: none;
            -webkit-text-security: disc; font-family: 'Georgia', serif;
        }
        .pin input:focus {
            border-color: #c1785c; box-shadow: 0 0 0 3px rgba(193,120,92,0.06);
        }
        .pin-error { color: #c1785c; font-size: 12px; min-height: 18px; }

        .btn-unlock {
            margin-top: 16px; padding: 10px 44px; border-radius: 50px; border: none;
            font-size: 13px; letter-spacing: 2px; cursor: pointer;
            background: #c1785c; color: #fff; transition: all 0.3s;
        }
        .btn-unlock:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(193,120,92,0.25); }

        /* 主内容 */
        .hero {
            position: relative; z-index: 1; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 40px 20px;
        }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 6px 22px; border: 1px solid rgba(193,120,92,0.2);
            border-radius: 50px; font-size: 10px; color: #c1785c;
            margin-bottom: 32px; letter-spacing: 4px;
        }
        .hero-title {
            font-family: 'Georgia', serif;
            font-size: clamp(40px, 8vw, 56px);
            color: #3d3029; margin-bottom: 6px;
            letter-spacing: 4px; line-height: 1.15; font-weight: normal;
        }
        .hero-title em {
            font-style: normal; color: #c1785c;
        }
        .hero-sub {
            font-size: 13px; color: #9b8c7e; margin-bottom: 52px; letter-spacing: 3px;
        }

        .countdown { display: flex; gap: 14px; margin-bottom: 52px; }
        .cd-item {
            background: #fff; border-radius: 10px;
            padding: 18px 22px; min-width: 78px;
            box-shadow: 0 1px 8px rgba(61,48,41,0.04);
            border: 1px solid rgba(193,120,92,0.06);
        }
        .cd-num {
            font-size: 34px; color: #c1785c;
            font-family: 'Georgia', serif; line-height: 1;
        }
        .cd-label {
            font-size: 10px; color: #9b8c7e; margin-top: 6px;
            letter-spacing: 2px; text-transform: uppercase;
        }

        .btn-enter {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 44px; border-radius: 50px; border: none;
            font-size: 14px; cursor: pointer; letter-spacing: 2px;
            background: #c1785c; color: #fff;
            text-decoration: none; transition: all 0.4s;
            box-shadow: 0 4px 16px rgba(193,120,92,0.2);
        }
        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(193,120,92,0.3);
        }

        .hero-foot {
            position: fixed; bottom: 22px; left: 50%;
            transform: translateX(-50%);
            font-size: 11px; color: #c4b8ab; letter-spacing: 2px;
        }

        @media (max-width: 640px) {
            .lock-box { padding: 32px 16px; }
            .lock-box h1 { font-size: 20px; }
            .pin input { width: 38px; height: 44px; font-size: 18px; }
            .countdown { gap: 8px; }
            .cd-item { padding: 14px 12px; min-width: 62px; }
            .cd-num { font-size: 26px; }
        }
    </style>
</head>
<body>

<div class="lock" id="passwordOverlay">
    <div class="lock-box">
        <span class="rose">🌹</span>
        <h1>我们的故事</h1>
        <p class="hint">输入密码，打开回忆之门</p>
        <div class="pin" id="passwordInput">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
        </div>
        <div class="pin-error" id="passwordError"></div>
        <button class="btn-unlock" id="passwordSubmit">确认</button>
    </div>
</div>

<div class="hero" id="hero">
    <div class="hero-badge">✦ TWO YEARS ✦</div>
    <h1 class="hero-title">两周年<em>快乐</em></h1>
    <p class="hero-sub">2024 · 06 · 10 — 2026 · 06 · 10</p>

    <div class="countdown" id="countdown">
        <div class="cd-item"><div class="cd-num" id="days">00</div><div class="cd-label">天</div></div>
        <div class="cd-item"><div class="cd-num" id="hours">00</div><div class="cd-label">时</div></div>
        <div class="cd-item"><div class="cd-num" id="minutes">00</div><div class="cd-label">分</div></div>
        <div class="cd-item"><div class="cd-num" id="seconds">00</div><div class="cd-label">秒</div></div>
    </div>

    <a href="./pages/timeline.html" class="btn-enter">开始回忆之旅</a>
</div>

<div class="hero-foot">Made with ♥ for you</div>

<script src="./js/main.js"></script>
<script>
(function() {
    function mkParticle() {
        var p = document.createElement('div');
        p.style.cssText = 'position:fixed;pointer-events:none;z-index:0;border-radius:50%;'
            + 'background:rgba(193,120,92,0.08);left:' + Math.random()*100 + '%;'
            + 'width:' + (3+Math.random()*4) + 'px;height:' + p.style.width.split(':')[1] + ';'
            + 'animation:drift ' + (10+Math.random()*14) + 's linear infinite;'
            + 'animation-delay:' + Math.random()*8 + 's;';
        document.body.appendChild(p);
        setTimeout(function() { p.remove(); }, 24000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes drift{0%{transform:translateY(105vh) scale(0);opacity:0;}'
        + '10%{opacity:0.5;}90%{opacity:0.5;}100%{transform:translateY(-10vh) scale(1.2);opacity:0;}}';
    document.head.appendChild(style);
    for (var i = 0; i < 12; i++) setTimeout(mkParticle, i*400);
    setInterval(mkParticle, 2800);
})();

var inputs = document.querySelectorAll('#passwordInput input');
var overlay = document.getElementById('passwordOverlay');
var err = document.getElementById('passwordError');
var CORRECT = '980711';
if (localStorage.getItem('anniversary_unlocked') === 'true') overlay.classList.add('hidden');

inputs.forEach(function(inp, i) {
    inp.addEventListener('input', function() {
        inp.value = inp.value.replace(/\D/g, '');
        if (inp.value && i < inputs.length-1) inputs[i+1].focus();
        if (i === inputs.length-1 && inp.value) check();
    });
    inp.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i-1].focus();
    });
});
document.getElementById('passwordSubmit').addEventListener('click', check);

function check() {
    var p = Array.from(inputs).map(function(i) { return i.value; }).join('');
    if (p === CORRECT) {
        localStorage.setItem('anniversary_unlocked', 'true');
        overlay.classList.add('hidden'); err.textContent = '';
        if (typeof initMusic === 'function') initMusic();
    } else {
        err.textContent = '密码不对，再试一次';
        inputs.forEach(function(i) { i.value = ''; i.style.borderColor = '#c1785c'; });
        inputs[0].focus();
        setTimeout(function() { inputs.forEach(function(i) { i.style.borderColor = ''; }); }, 600);
    }
}

var TARGET = new Date('2026-06-10T00:15:00').getTime();
function tick() {
    var diff = TARGET - Date.now();
    if (diff <= 0) {
        document.getElementById('days').textContent = '✦';
        document.getElementById('hours').textContent = '永';
        document.getElementById('minutes').textContent = '远';
        document.getElementById('seconds').textContent = '♥';
        return;
    }
    document.getElementById('days').textContent = String(Math.floor(diff/86400000)).padStart(2,'0');
    document.getElementById('hours').textContent = String(Math.floor((diff%86400000)/3600000)).padStart(2,'0');
    document.getElementById('minutes').textContent = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    document.getElementById('seconds').textContent = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
