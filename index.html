<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两周年快乐 ❤</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- 密码锁 -->
<div class="password-overlay" id="passwordOverlay">
    <div class="password-box">
        <h1>❤ 我们的故事</h1>
        <p>请输入密码进入</p>
        <div class="password-input" id="passwordInput">
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus>
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]">
        </div>
        <div class="password-error" id="passwordError"></div>
    </div>
</div>

<!-- 首页主内容 -->
<div class="hero" id="hero">
    <h1 class="hero-title">两周年快乐</h1>
    <p class="hero-date">2024.06.10 — 2026.06.10</p>

    <div class="countdown" id="countdown">
        <div class="countdown-item">
            <div class="countdown-num" id="days">00</div>
            <div class="countdown-label">天</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-num" id="hours">00</div>
            <div class="countdown-label">时</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-num" id="minutes">00</div>
            <div class="countdown-label">分</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-num" id="seconds">00</div>
            <div class="countdown-label">秒</div>
        </div>
    </div>

    <div class="hero-enter">
        <a href="/pages/timeline.html" class="btn btn-primary">开始回忆之旅 →</a>
    </div>
</div>

<script src="/js/main.js"></script>
<script>
// === 密码锁 ===
const CORRECT_PASSWORD = '980711';
const inputs = document.querySelectorAll('#passwordInput input');
const overlay = document.getElementById('passwordOverlay');
const error = document.getElementById('passwordError');

// 检查是否已解锁
if (localStorage.getItem('anniversary_unlocked') === 'true') {
    overlay.classList.add('hidden');
}

inputs.forEach((input, idx) => {
    input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '');
        if (input.value && idx < inputs.length - 1) {
            inputs[idx + 1].focus();
        }
        if (idx === inputs.length - 1 && input.value) {
            checkPassword();
        }
    });
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
            inputs[idx - 1].focus();
        }
    });
});

function checkPassword() {
    const pwd = Array.from(inputs).map(i => i.value).join('');
    if (pwd === CORRECT_PASSWORD) {
        localStorage.setItem('anniversary_unlocked', 'true');
        overlay.classList.add('hidden');
        error.textContent = '';
    } else {
        error.textContent = '密码错误，再试一次 ✨';
        inputs.forEach(i => i.value = '');
        inputs[0].focus();
    }
}

// === 倒计时 ===
const TARGET = new Date('2026-06-10T00:15:00').getTime();

function updateCountdown() {
    const now = Date.now();
    const diff = TARGET - now;

    if (diff <= 0) {
        document.getElementById('days').textContent = '🎉';
        document.getElementById('hours').textContent = '就';
        document.getElementById('minutes').textContent = '是';
        document.getElementById('seconds').textContent = '今';
        return;
    }

    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);

    document.getElementById('days').textContent = String(d).padStart(2, '0');
    document.getElementById('hours').textContent = String(h).padStart(2, '0');
    document.getElementById('minutes').textContent = String(m).padStart(2, '0');
    document.getElementById('seconds').textContent = String(s).padStart(2, '0');
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
