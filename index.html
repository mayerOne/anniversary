<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两周年快乐 ✦</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        body {
            background: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0a0a0f 60%, #000 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 光点粒子 */
        .light-particle {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
            background: var(--primary);
            animation: floatUp linear infinite;
            box-shadow: 0 0 6px var(--primary-glow);
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* 密码锁 */
        .password-overlay {
            position: fixed; inset: 0; z-index: 999;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .password-overlay.hidden {
            opacity: 0; visibility: hidden; pointer-events: none;
        }

        .password-box {
            text-align: center; padding: 56px 44px;
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
            max-width: 420px; width: 90%;
            animation: fadeInUp 0.8s ease;
        }

        .password-box .icon {
            font-size: 64px; margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(201,169,110,0.3));
        }

        .password-box h1 {
            font-family: var(--font-serif); font-size: 28px;
            color: var(--primary-glow); margin-bottom: 6px; letter-spacing: 3px;
        }
        .password-box .hint { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }

        .password-input {
            display: flex; gap: 10px; justify-content: center; margin-bottom: 12px;
        }
        .password-input input {
            width: 46px; height: 56px; text-align: center; font-size: 24px;
            border: 2px solid rgba(201,169,110,0.25); border-radius: 14px;
            outline: none; font-family: var(--font-serif); color: var(--text);
            background: rgba(255,255,255,0.03); transition: all 0.3s;
            -webkit-appearance: none;
        }
        .password-input input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(201,169,110,0.1), 0 0 20px rgba(201,169,110,0.1);
            transform: translateY(-2px); background: rgba(201,169,110,0.06);
        }
        .password-error { color: #e74c3c; font-size: 13px; min-height: 20px; }

        /* 主内容 */
        .hero {
            position: relative; z-index: 1;
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 40px 24px;
        }

        .hero-glow {
            position: absolute; width: 600px; height: 600px;
            border-radius: 50%; background: radial-gradient(circle, rgba(201,169,110,0.08), transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
        }

        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 24px; background: rgba(201,169,110,0.08);
            border: 1px solid rgba(201,169,110,0.2); border-radius: 50px;
            font-size: 12px; color: var(--primary-glow); margin-bottom: 28px;
            animation: fadeInUp 1s ease; letter-spacing: 3px; text-transform: uppercase;
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(36px, 8vw, 64px);
            color: var(--text); margin-bottom: 6px;
            animation: fadeInUp 1s ease 0.15s both;
            letter-spacing: 4px; line-height: 1.2;
        }

        .hero-title .gold {
            color: var(--primary-glow);
            text-shadow: 0 0 40px rgba(201,169,110,0.4);
        }

        .hero-subtitle {
            font-size: 15px; color: var(--text-muted); margin-bottom: 48px;
            animation: fadeInUp 1s ease 0.3s both; letter-spacing: 4px;
        }

        /* 倒计时 */
        .countdown {
            display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
            margin-bottom: 52px; animation: fadeInUp 1s ease 0.45s both;
        }
        .countdown-item {
            background: rgba(20,20,35,0.7); backdrop-filter: blur(8px);
            border-radius: 16px; padding: 20px 24px; min-width: 90px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
        }
        .countdown-num {
            font-size: 40px; font-weight: 700; color: var(--primary-glow);
            font-family: var(--font-serif); line-height: 1;
        }
        .countdown-label {
            font-size: 11px; color: var(--text-muted); margin-top: 6px; letter-spacing: 2px;
        }

        /* 入口 */
        .hero-actions {
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            animation: fadeInUp 1s ease 0.6s both;
        }
        .btn-enter {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 16px 48px; border: none; border-radius: 50px;
            font-size: 17px; font-family: var(--font-sans);
            cursor: pointer; transition: all 0.4s;
            background: linear-gradient(135deg, var(--primary) 0%, #a0844e 100%);
            color: #fff; box-shadow: 0 8px 32px rgba(201,169,110,0.3);
            text-decoration: none; letter-spacing: 2px;
        }
        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 48px rgba(201,169,110,0.45);
        }
        .hero-quick-links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
        .hero-quick-links a {
            padding: 8px 18px; border-radius: 20px; font-size: 13px;
            color: var(--text-muted); background: rgba(201,169,110,0.05);
            border: 1px solid var(--border); transition: all 0.3s;
            text-decoration: none; letter-spacing: 1px;
        }
        .hero-quick-links a:hover {
            background: rgba(201,169,110,0.12); color: var(--primary-glow);
            border-color: rgba(201,169,110,0.3);
        }
        .hero-footer {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            font-size: 12px; color: var(--text-muted); animation: fadeInUp 1s ease 0.9s both;
            white-space: nowrap; letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            .password-box { padding: 40px 24px; }
            .password-box h1 { font-size: 22px; }
            .password-input input { width: 40px; height: 48px; font-size: 20px; }
            .countdown { gap: 10px; }
            .countdown-item { padding: 14px 16px; min-width: 68px; }
            .countdown-num { font-size: 30px; }
        }
    </style>
</head>
<body>

<!-- 密码锁 -->
<div class="password-overlay" id="passwordOverlay">
    <div class="password-box">
        <div class="icon">✦</div>
        <h1>我们的故事</h1>
        <p class="hint">输入密码，打开回忆之门</p>
        <div class="password-input" id="passwordInput">
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus>
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]">
        </div>
        <div class="password-error" id="passwordError"></div>
    </div>
</div>

<!-- 主内容 -->
<div class="hero" id="hero">
    <div class="hero-glow"></div>
    <div class="hero-badge">✦ Two Years ✦</div>
    <h1 class="hero-title">两周年<span class="gold">快乐</span></h1>
    <p class="hero-subtitle">2024 · 06 · 10 — 2026 · 06 · 10</p>

    <div class="countdown" id="countdown">
        <div class="countdown-item">
            <div class="countdown-num" id="days">00</div>
            <div class="countdown-label">天</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-num" id="hours">00</div>
            <div class="countdown-label">时</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-num" id="minutes">00</div>
            <div class="countdown-label">分</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-num" id="seconds">00</div>
            <div class="countdown-label">秒</div>
        </div>
    </div>

    <div class="hero-actions">
        <a href="./pages/timeline.html" class="btn-enter">✦ 开始回忆之旅</a>
        <div class="hero-quick-links">
            <a href="./pages/gallery.html">照片墙</a>
            <a href="./pages/map.html">足迹地图</a>
            <a href="./pages/letters.html">情书</a>
            <a href="./pages/scratch.html">刮刮乐</a>
        </div>
    </div>
</div>

<div class="hero-footer">Made with ✦ for you</div>

<script src="./js/main.js"></script>
<script>
// === 光点粒子 ===
(function() {
    function createParticle() {
        var p = document.createElement('div');
        p.className = 'light-particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = (2 + Math.random() * 3) + 'px';
        p.style.height = p.style.width;
        p.style.animationDuration = (6 + Math.random() * 10) + 's';
        p.style.animationDelay = Math.random() * 5 + 's';
        document.body.appendChild(p);
        setTimeout(function() { p.remove(); }, 16000);
    }
    for (var i = 0; i < 20; i++) setTimeout(createPetal, i * 400);
    setInterval(createPetal, 2000);
})();

// === 密码锁 ===
var CORRECT_PASSWORD = '980711';
var inputs = document.querySelectorAll('#passwordInput input');
var overlay = document.getElementById('passwordOverlay');
var pwdError = document.getElementById('passwordError');

if (localStorage.getItem('anniversary_unlocked') === 'true') {
    overlay.classList.add('hidden');
}

inputs.forEach(function(input, idx) {
    input.addEventListener('input', function() {
        input.value = input.value.replace(/\D/g, '');
        if (input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
        if (idx === inputs.length - 1 && input.value) checkPassword();
    });
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !input.value && idx > 0) inputs[idx - 1].focus();
    });
});

function checkPassword() {
    var pwd = Array.from(inputs).map(function(i) { return i.value; }).join('');
    if (pwd === CORRECT_PASSWORD) {
        localStorage.setItem('anniversary_unlocked', 'true');
        overlay.classList.add('hidden');
        pwdError.textContent = '';
        if (typeof initMusic === 'function') initMusic();
    } else {
        pwdError.textContent = '密码不对，再试一次 ✦';
        inputs.forEach(function(i) { i.value = ''; i.style.borderColor = '#e74c3c'; });
        inputs[0].focus();
        setTimeout(function() { inputs.forEach(function(i) { i.style.borderColor = ''; }); }, 500);
    }
}

// === 倒计时 ===
var TARGET = new Date('2026-06-10T00:15:00').getTime();

function updateCountdown() {
    var now = Date.now(), diff = TARGET - now;

    if (diff <= 0) {
        document.getElementById('days').textContent = '✦';
        document.getElementById('hours').textContent = '永';
        document.getElementById('minutes').textContent = '远';
        document.getElementById('seconds').textContent = '♥';
        return;
    }
    document.getElementById('days').textContent = String(Math.floor(diff / 86400000)).padStart(2, '0');
    document.getElementById('hours').textContent = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, '0');
    document.getElementById('minutes').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
    document.getElementById('seconds').textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
