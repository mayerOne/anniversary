<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老虎机 — 惊喜大奖</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .main { max-width: 560px; }
        body { background: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0a0a0f 60%, #000 100%); }

        .slot-machine {
            background: linear-gradient(180deg, rgba(201,169,110,0.12), rgba(201,169,110,0.04));
            border: 1px solid rgba(201,169,110,0.25);
            border-radius: 24px; padding: 36px 28px 28px;
            box-shadow: 0 12px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,169,110,0.1) inset;
            max-width: 480px; margin: 0 auto;
        }

        .slot-top {
            text-align: center; margin-bottom: 20px;
        }
        .slot-top .jackpot {
            font-size: 12px; color: var(--text-muted); letter-spacing: 3px;
            margin-bottom: 4px; text-transform: uppercase;
        }
        .slot-top .jackpot-val {
            font-family: var(--font-serif); font-size: 32px; color: var(--primary-glow);
            text-shadow: 0 0 20px rgba(201,169,110,0.4);
        }

        .reels {
            display: flex; gap: 12px; justify-content: center; margin-bottom: 24px;
        }
        .reel-window {
            width: 120px; height: 140px;
            background: rgba(0,0,0,0.5); border-radius: 16px;
            overflow: hidden; position: relative;
            border: 2px solid rgba(201,169,110,0.3);
            box-shadow: 0 0 0 4px rgba(0,0,0,0.4), 0 0 30px rgba(201,169,110,0.1) inset;
        }
        .reel-window::before, .reel-window::after {
            content: ''; position: absolute; left: 0; right: 0; height: 40px; z-index: 2; pointer-events: none;
        }
        .reel-window::before { top: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .reel-window::after { bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }

        .reel-strip {
            transition: transform 0.3s cubic-bezier(0.1, 0.6, 0.3, 1);
            will-change: transform;
        }
        .reel-strip .item {
            height: 70px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 36px; line-height: 1;
        }
        .reel-strip .item .name {
            font-size: 10px; color: var(--text-muted); margin-top: 2px;
        }

        /* 高亮线 */
        .reel-window .win-line {
            position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
            height: 70px; border-top: 1px dashed rgba(201,169,110,0.3);
            border-bottom: 1px dashed rgba(201,169,110,0.3);
            pointer-events: none; z-index: 1;
        }

        .slot-result {
            text-align: center; min-height: 48px; margin-bottom: 16px;
        }
        .slot-result .prize-title {
            font-family: var(--font-serif); font-size: 20px; color: var(--primary-glow);
        }
        .slot-result .prize-text { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

        .spin-btn {
            display: block; margin: 0 auto; padding: 16px 56px;
            border: none; border-radius: 50px; cursor: pointer;
            font-size: 20px; letter-spacing: 4px; font-family: var(--font-sans);
            background: linear-gradient(135deg, var(--primary) 0%, #a0844e 100%);
            color: #fff; box-shadow: 0 8px 32px rgba(201,169,110,0.35);
            transition: all 0.3s;
        }
        .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 48px rgba(201,169,110,0.5); }
        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        .win-flash {
            animation: winGlow 0.6s ease-out;
        }
        @keyframes winGlow {
            0% { box-shadow: 0 0 0 rgba(201,169,110,0), 0 0 0 rgba(201,169,110,0) inset; }
            50% { box-shadow: 0 0 60px rgba(201,169,110,0.6), 0 0 40px rgba(201,169,110,0.3) inset; }
            100% { box-shadow: 0 0 0 rgba(201,169,110,0), 0 0 0 rgba(201,169,110,0) inset; }
        }

        .history { margin-top: 24px; text-align: center; }
        .history .badge {
            display: inline-block; padding: 4px 12px; margin: 3px; border-radius: 12px;
            font-size: 11px; background: rgba(201,169,110,0.1); color: var(--primary-glow);
            border: 1px solid rgba(201,169,110,0.2);
        }

        @media (max-width: 500px) {
            .slot-machine { padding: 24px 12px 20px; }
            .reel-window { width: 90px; height: 110px; }
            .reel-strip .item { height: 55px; font-size: 28px; }
            .reel-window .win-line { height: 55px; }
            .spin-btn { padding: 14px 40px; font-size: 17px; }
        }
    </style>
</head>
<body>

<div class="main">
    <h1 class="page-title">幸运老虎机</h1>
    <p class="page-subtitle">按下按钮，看看今天抽中什么惊喜 ✦</p>

    <div class="slot-machine" id="machine">
        <div class="slot-top">
            <div class="jackpot">✦ JACKPOT ✦</div>
            <div class="jackpot-val" id="jackpot">???</div>
        </div>

        <div class="reels">
            <div class="reel-window"><div class="win-line"></div><div class="reel-strip" id="reel0"></div></div>
            <div class="reel-window"><div class="win-line"></div><div class="reel-strip" id="reel1"></div></div>
            <div class="reel-window"><div class="win-line"></div><div class="reel-strip" id="reel2"></div></div>
        </div>

        <div class="slot-result">
            <div class="prize-title" id="prizeTitle"></div>
            <div class="prize-text" id="prizeText"></div>
        </div>

        <button class="spin-btn" id="spinBtn" onclick="spin()">✦ 旋 转 ✦</button>

        <div class="history" id="history"></div>
    </div>
</div>

<script src="../js/main.js"></script>
<script>
var gifts = [
    { icon: '💌', title: '情书一封', text: '你是我写不完的故事' },
    { icon: '💐', title: '一束玫瑰', text: '每一朵都代表想你' },
    { icon: '🍽️', title: '烛光晚餐', text: '我下厨，你享用' },
    { icon: '✈️', title: '旅行基金', text: '下一站你想去哪里？' },
    { icon: '🎬', title: '电影之夜', text: '陪你刷完所有想看的' },
    { icon: '💆', title: '按摩券', text: '随叫随到，包你满意' },
    { icon: '🎁', title: '神秘礼物', text: '拆开才知道是什么哦' },
    { icon: '💤', title: '陪你赖床', text: '周末上午全都是你的' },
    { icon: '💍', title: '最好的礼物', text: '我的余生，都给你' }
];

var REEL_COUNT = 3;
var ITEM_HEIGHT = 70;
var SPIN_EXTRA = 6;
var prizeHistory = [];
var spinning = false;

function getItemHeight() {
    var item = document.querySelector('.reel-strip .item');
    return item ? item.offsetHeight : ITEM_HEIGHT;
}

function buildReelStrip() {
    var shuffled = gifts.slice().sort(function() { return Math.random() - 0.5; });
    var triple = shuffled.concat(shuffled).concat(shuffled);
    return triple.map(function(g) {
        return '<div class="item"><span>' + g.icon + '</span><span class="name">' + g.title + '</span></div>';
    }).join('');
}

function initReels() {
    ITEM_HEIGHT = getItemHeight();
    for (var i = 0; i < REEL_COUNT; i++) {
        document.getElementById('reel' + i).innerHTML = buildReelStrip();
        var offset = Math.floor(Math.random() * gifts.length) * ITEM_HEIGHT + gifts.length * ITEM_HEIGHT;
        document.getElementById('reel' + i).style.transform = 'translateY(-' + offset + 'px)';
    }
}

function spin() {
    if (spinning) return;
    spinning = true;
    ITEM_HEIGHT = getItemHeight();
    var btn = document.getElementById('spinBtn');
    btn.disabled = true;
    btn.textContent = '✦ ... ✦';
    document.getElementById('prizeTitle').textContent = '';
    document.getElementById('prizeText').textContent = '';
    document.getElementById('jackpot').textContent = '???';

    var results = [];
    var maxDelay = 0;

    for (var i = 0; i < REEL_COUNT; i++) {
        (function(idx) {
            var resultIdx = Math.floor(Math.random() * gifts.length);
            results.push(resultIdx);
            var midCopy = gifts.length * ITEM_HEIGHT;
            var target = midCopy + resultIdx * ITEM_HEIGHT + gifts.length * SPIN_EXTRA * ITEM_HEIGHT;
            var duration = 800 + idx * 400;
            maxDelay = Math.max(maxDelay, duration);

            setTimeout(function() {
                var reel = document.getElementById('reel' + idx);
                reel.style.transition = 'transform ' + (0.5 + idx * 0.2) + 's cubic-bezier(0.12, 0.82, 0.28, 1)';
                reel.style.transform = 'translateY(-' + target + 'px)';
            }, idx * 200);
        })(i);
    }

    setTimeout(function() {
        var prize = gifts[results[0]];
        document.getElementById('jackpot').textContent = prize.icon;
        document.getElementById('prizeTitle').textContent = prize.title;
        document.getElementById('prizeText').textContent = prize.text;
        document.getElementById('machine').classList.add('win-flash');
        setTimeout(function() { document.getElementById('machine').classList.remove('win-flash'); }, 600);

        prizeHistory.unshift(prize.icon + ' ' + prize.title);
        if (prizeHistory.length > 8) prizeHistory.pop();
        renderHistory();

        btn.textContent = '✦ 再抽一次 ✦';
        btn.disabled = false;
        spinning = false;
    }, maxDelay + 600);
}

function renderHistory() {
    document.getElementById('history').innerHTML = prizeHistory.map(function(h) {
        return '<span class="badge">' + h + '</span>';
    }).join('');
}

initReels();
</script>
</body>
</html>
