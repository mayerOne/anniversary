<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片墙 — 我们的故事</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .main { max-width: 100vw; padding: 80px 0 0; }
        body {
            background: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0a0a0f 60%, #000 100%);
            overflow-x: hidden;
        }

        .gallery-stage {
            position: relative; width: 100%; height: 75vh; min-height: 500px;
            background: #000; overflow: hidden;
        }
        .gallery-slide {
            position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .gallery-slide.active { opacity: 1; }
        .gallery-slide img {
            width: 100%; height: 100%; object-fit: contain;
            animation: kenBurns 8s ease-in-out infinite alternate;
        }
        @keyframes kenBurns {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }
        .gallery-slide .slide-caption {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 60px 40px 32px;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            text-align: center;
        }
        .slide-caption .cap-title {
            font-family: var(--font-serif); font-size: 22px;
            color: var(--primary-glow); margin-bottom: 4px;
        }
        .slide-caption .cap-desc { font-size: 13px; color: rgba(255,255,255,0.6); }

        /* 进度条 */
        .progress-bar {
            position: absolute; bottom: 0; left: 0; height: 2px;
            background: var(--primary); z-index: 5; transition: width 0.1s linear;
        }

        /* 侧边按钮 */
        .gallery-arrow {
            position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
            width: 44px; height: 44px; border-radius: 50%; border: none;
            background: rgba(20,20,35,0.6); backdrop-filter: blur(8px);
            color: var(--primary-glow); font-size: 20px; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .gallery-arrow:hover { background: rgba(201,169,110,0.3); }
        .gallery-arrow.prev { left: 20px; }
        .gallery-arrow.next { right: 20px; }

        /* 缩略图 */
        .thumb-strip {
            display: flex; gap: 8px; justify-content: center; padding: 14px 20px;
            overflow-x: auto; -webkit-overflow-scrolling: touch;
            background: rgba(10,10,15,0.5);
        }
        .thumb-strip img {
            width: 56px; height: 38px; object-fit: cover; border-radius: 6px;
            cursor: pointer; opacity: 0.4; transition: all 0.3s;
            border: 2px solid transparent; flex-shrink: 0;
        }
        .thumb-strip img.active { opacity: 1; border-color: var(--primary); }
        .thumb-strip img:hover { opacity: 0.8; }

        .counter {
            position: absolute; top: 20px; right: 28px; z-index: 5;
            font-size: 13px; color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
        }

        .full-lightbox {
            position: fixed; inset: 0; z-index: 99999;
            background: rgba(0,0,0,0.96);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.4s;
        }
        .full-lightbox.open { opacity: 1; visibility: visible; }
        .full-lightbox img {
            max-width: 92vw; max-height: 85vh; border-radius: 12px;
            transform: scale(0.9); transition: transform 0.4s;
        }
        .full-lightbox.open img { transform: scale(1); }
        .lightbox-close {
            position: absolute; top: 24px; right: 36px; color: #fff;
            font-size: 36px; cursor: pointer; opacity: 0.5; z-index: 2;
        }
        .lightbox-close:hover { opacity: 1; }

        @media (max-width: 600px) {
            .gallery-stage { height: 55vh; min-height: 380px; }
            .gallery-arrow { width: 36px; height: 36px; font-size: 16px; }
            .gallery-arrow.prev { left: 8px; }
            .gallery-arrow.next { right: 8px; }
            .slide-caption .cap-title { font-size: 17px; }
            .thumb-strip img { width: 44px; height: 30px; }
        }
    </style>
</head>
<body>

<div class="main">
    <h1 class="page-title" style="margin-bottom:8px;">记忆相册</h1>
    <p class="page-subtitle" style="margin-bottom:20px;">每一帧都是最美的时光</p>

    <div class="gallery-stage" id="stage">
        <span class="counter" id="counter">1 / 1</span>
        <div id="slidesContainer"></div>
        <div class="progress-bar" id="progressBar"></div>
        <button class="gallery-arrow prev" onclick="prevSlide()">&#10094;</button>
        <button class="gallery-arrow next" onclick="nextSlide()">&#10095;</button>
    </div>
    <div class="thumb-strip" id="thumbStrip"></div>
</div>

<div class="full-lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" src="" alt="">
</div>

<script src="../js/main.js"></script>
<script>
// 每张照片的标题和描述，按 data/gallery.json 中的顺序
var captions = [
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' },
    { title: '记忆相片', desc: '' }
];

var current = 0;
var total = 0;
var progressTimer;
var autoplayTimer;
var AUTOPLAY_MS = 5000;

function buildGallery(files) {
    total = files.length;
    if (total === 0) {
        document.getElementById('slidesContainer').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:14px;">请将照片放入 images/gallery/ 文件夹 ✦</div>';
        return;
    }

    var slidesHtml = '';
    var thumbsHtml = '';
    files.forEach(function(file, i) {
        var cap = captions[i] || { title: '记忆相片', desc: '' };
        var src = '../images/gallery/' + file;
        slidesHtml +=
            '<div class="gallery-slide' + (i === 0 ? ' active' : '') + '">' +
            '<img src="' + src + '" alt="" onclick="openLightbox(this.src)">' +
            '<div class="slide-caption"><div class="cap-title">' + cap.title + '</div>' +
            '<div class="cap-desc">' + cap.desc + '</div></div></div>';
        thumbsHtml += '<img src="' + src + '" alt="" class="' + (i === 0 ? 'active' : '') +
            '" onclick="goToSlide(' + i + ')">';
    });

    document.getElementById('slidesContainer').innerHTML = slidesHtml;
    document.getElementById('thumbStrip').innerHTML = thumbsHtml;
    document.getElementById('counter').textContent = '1 / ' + total;
    startAutoplay();
}

function goToSlide(n) {
    n = (n + total) % total;
    var slides = document.querySelectorAll('.gallery-slide');
    slides[current].classList.remove('active');
    slides[n].classList.add('active');

    var thumbs = document.querySelectorAll('.thumb-strip img');
    if (thumbs[current]) thumbs[current].classList.remove('active');
    if (thumbs[n]) thumbs[n].classList.add('active');

    current = n;
    document.getElementById('counter').textContent = (n + 1) + ' / ' + total;
    resetAutoplay();
}

function nextSlide() { goToSlide(current + 1); }
function prevSlide() { goToSlide(current - 1); }

function resetAutoplay() {
    clearInterval(autoplayTimer);
    clearInterval(progressTimer);
    var bar = document.getElementById('progressBar');
    bar.style.transition = 'none';
    bar.style.width = '0%';

    var start = Date.now();
    progressTimer = setInterval(function() {
        var pct = ((Date.now() - start) / AUTOPLAY_MS) * 100;
        if (pct >= 100) {
            pct = 100;
            clearInterval(progressTimer);
        }
        bar.style.width = pct + '%';
    }, 50);

    autoplayTimer = setTimeout(function() { nextSlide(); }, AUTOPLAY_MS);
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
    if (e.key === 'Escape') closeLightbox();
});

var touchStartX = 0;
document.getElementById('stage').addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; });
document.getElementById('stage').addEventListener('touchend', function(e) {
    var diff = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(diff) > 50) { diff > 0 ? prevSlide() : nextSlide(); }
});

function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
}

fetch('../data/gallery.json').then(function(r) { return r.json(); }).then(buildGallery);
</script>
</body>
</html>
