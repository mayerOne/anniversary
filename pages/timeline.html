<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间线 - 我们的故事</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="main">
    <h1 class="page-title">我们的故事</h1>
    <p class="page-subtitle">每一个瞬间都值得被记住</p>
    <div class="timeline" id="timeline"></div>
</div>

<script src="../js/main.js"></script>
<script>
loadJSON('../data/timeline.json').then(data => {
    const container = document.getElementById('timeline');
    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'timeline-item card';
        div.innerHTML = `
            <div class="timeline-dot"></div>
            <div class="timeline-date">${item.date}</div>
            <div class="timeline-title">${item.title}</div>
            <div class="timeline-desc">${item.desc}</div>
            ${item.image ? `<img class="timeline-img" src="${item.image}" alt="${item.title}">` : ''}
        `;
        container.appendChild(div);
    });
}).catch(err => {
    document.getElementById('timeline').innerHTML = '<p style="text-align:center;color:var(--text-light)">加载中...</p>';
});
</script>
</body>
</html>
