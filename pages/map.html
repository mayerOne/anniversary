<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的足迹 — 中国地图</title>
    <link rel="stylesheet" href="https://lib.baomitu.com/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .main { max-width: 1100px; }
        body { background: #f8f4ed; }
        #map { height: 620px; }

        .map-legend {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 18px;
        }
        .legend-item {
            display: flex; align-items: center; gap: 5px; font-size: 12px;
            color: #9b8c7e; cursor: pointer; transition: all 0.2s;
            padding: 4px 10px; border-radius: 20px; border: 1px solid transparent;
        }
        .legend-item:hover { color: #c1785c; border-color: rgba(193,120,92,0.2); background: rgba(193,120,92,0.04); }
        .legend-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #c1785c; box-shadow: 0 0 6px rgba(193,120,92,0.3);
        }

        @keyframes markerPulse {
            0% { transform: scale(0.8); opacity: 0.7; }
            100% { transform: scale(2.2); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="main">
    <h1 class="page-title">我们的足迹</h1>
    <p class="page-subtitle">标记的每个地方，都有我们的故事</p>
    <div id="map"></div>
    <div class="map-legend" id="legend"></div>
</div>

<script>
// Leaflet CDN fallback
function loadLeaflet(cb) {
    var urls = [
        'https://lib.baomitu.com/leaflet/1.9.4/leaflet.min.js',
        'https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'
    ];
    function tryLoad(i) {
        if (i >= urls.length) { console.error('Leaflet failed to load from all CDNs'); return; }
        var s = document.createElement('script');
        s.src = urls[i];
        s.onload = cb;
        s.onerror = function() { tryLoad(i + 1); };
        document.head.appendChild(s);
    }
    tryLoad(0);
}

loadLeaflet(function() {
    var places = [
        { lat: 22.5431, lng: 114.0579, title: '深圳', slug: 'shenzhen',   desc: '我们相遇相爱的城市，是一切开始的地方。' },
        { lat: 31.2304, lng: 121.4737, title: '上海', slug: 'shanghai',   desc: '外滩夜景，南京路漫步，你说这城市太魔幻了。' },
        { lat: 32.0603, lng: 118.7969, title: '南京', slug: 'nanjing',    desc: '秦淮河畔灯火阑珊，梧桐树下漫步整座城。' },
        { lat: 30.2741, lng: 120.1551, title: '杭州', slug: 'hangzhou',   desc: '西湖断桥残雪，雷峰塔下我们许了愿。' },
        { lat: 31.2990, lng: 120.5853, title: '苏州', slug: 'suzhou',     desc: '拙政园里听评弹，平江路上牵手漫步。' },
        { lat: 23.1291, lng: 113.2644, title: '广州', slug: 'guangzhou',  desc: '肠粉早茶西关老巷，你说这里是美食天堂。' },
        { lat: 29.4316, lng: 106.9123, title: '重庆', slug: 'chongqing',  desc: '洪崖洞的夜景像千与千寻，火锅辣到流眼泪。' },
        { lat: 28.6820, lng: 115.8581, title: '南昌', slug: 'nanchang',   desc: '滕王阁上望赣江，英雄城里走一走。' },
        { lat: 27.6228, lng: 113.8545, title: '萍乡', slug: 'pingxiang',  desc: '萍水相逢，却是此生最美的意外。' },
        { lat: 26.8932, lng: 112.5720, title: '衡阳', slug: 'hengyang',   desc: '衡山脚下，你说要一起看遍世间风景。' },
        { lat: 28.2282, lng: 112.9388, title: '长沙', slug: 'changsha',   desc: '橘子洲头烟花绚烂，茶颜悦色一人一杯。' },
        { lat: 26.0745, lng: 119.2965, title: '福州', slug: 'fuzhou',     desc: '三坊七巷走九遍，鱼丸肉燕吃不够。' },
        { lat: 25.5037, lng: 119.7891, title: '平潭岛', slug: 'pingtan',  desc: '蓝眼泪划过海岸，像极了爱情的模样。' },
        { lat: 23.6820, lng: 113.0560, title: '清远',   slug: 'qingyuan', desc: '北江竹筏漂流，山野间的清凉回忆。' },
        { lat: 22.3193, lng: 114.1694, title: '香港',   slug: 'xianggang', desc: '维港霓虹闪烁，和你一起看遍繁华。' },
        { lat: 29.0316, lng: 111.6985, title: '常德',   slug: 'changde',  desc: '大小河街灯火，桃花源里遇见了你。' }
    ];

    var map = L.map('map', { zoomControl: false }).setView([27.5, 113.5], 6);

    // OpenStreetMap tiles (more accessible than CartoDB)
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
        subdomains: ['1','2','3','4'],
        attribution: '&copy; 高德地图 AutoNavi',
        maxZoom: 18
    }).addTo(map);

    L.control.zoom({ position: 'topright' }).addTo(map);

    var markerIcon = L.divIcon({
        className: '',
        html: '<div style="position:relative;width:20px;height:20px;">' +
            '<div style="position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(193,120,92,0.35);animation:markerPulse 2s ease-out infinite;"></div>' +
            '<div style="width:20px;height:20px;border-radius:50%;background:#c1785c;border:2px solid #fff;box-shadow:0 0 20px rgba(193,120,92,0.7),0 0 40px rgba(193,120,92,0.3);"></div></div>',
        iconSize: [30, 30], iconAnchor: [15, 15]
    });

    var legendContainer = document.getElementById('legend');
    var markers = [];

    fetch('../data/map.json').then(function(r) { return r.json(); }).then(function(mapData) {
        places.forEach(function(place) {
            var marker = L.marker([place.lat, place.lng], { icon: markerIcon }).addTo(map);
            marker.on('click', function() {
                location.href = 'city.html?city=' + place.slug;
            });

            var legendItem = document.createElement('div');
            legendItem.className = 'legend-item';
            legendItem.innerHTML = '<span class="legend-dot"></span>' + place.title;
            legendItem.addEventListener('click', function() {
                location.href = 'city.html?city=' + place.slug;
            });
            legendContainer.appendChild(legendItem);
        });
    });
    });
</script>
<script src="../js/main.js"></script>
</body>
</html>
