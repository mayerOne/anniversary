<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情书 - 我们的故事</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="main">
    <h1 class="page-title">给你的情书</h1>
    <p class="page-subtitle">有些话，用文字才说得出口</p>
    <div class="letter" id="letters"></div>
</div>

<script src="../js/main.js"></script>
<script>
loadJSON('/data/letters.json').then(data => {
    const container = document.getElementById('letters');
    if (data.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-light);padding:60px 0">正在酝酿中... 💌</p>';
        return;
    }
    data.forEach(letter => {
        const div = document.createElement('div');
        div.className = 'letter-card';
        div.innerHTML = `
            <div class="letter-date">${letter.date}</div>
            <div class="letter-content">${letter.content}</div>
        `;
        container.appendChild(div);
    });
}).catch(() => {
    document.getElementById('letters').innerHTML =
        '<p style="text-align:center;color:var(--text-light);padding:60px 0">加载中...</p>';
});
</script>
</body>
</html>
